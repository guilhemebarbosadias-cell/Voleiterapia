<title>Administração - Vôlei Terapia</title><link
    rel="stylesheet"
    href="style.css"
><style>

body{
    background:#f3f3f3;
}

.admin-header{
    background:#000;
    color:white;
    padding:25px 20px;
    text-align:center;
}

.admin-logo{
    font-size:30px;
    font-weight:bold;
}

.admin-logo span{
    color:#ff007f;
}

.admin-subtitle{
    margin-top:6px;
    color:#ccc;
}

.admin-container{
    max-width:1000px;
    margin:25px auto;
    padding:15px;
}

.admin-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:25px;
}

.admin-card{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 3px 10px #0002;
}

.admin-card h3{
    margin-top:0;
    color:#ff007f;
}

.admin-number{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
}

.admin-menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.admin-button{
    background:#000;
    color:white;
    border:none;
    border-radius:15px;
    padding:20px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.admin-button:hover{
    opacity:.9;
}

.admin-button span{
    display:block;
    font-size:28px;
    margin-bottom:8px;
}

.section{
    margin-top:25px;
}

.section-title{
    color:#000;
    margin-bottom:12px;
}

.admin-list{
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 3px 10px #0002;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

.logout{
    margin-top:25px;
    width:100%;
    background:#ff007f;
}


/* =====================================================
   PAGAMENTOS
   ===================================================== */

.pagamento-card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 3px 10px #0002;
}

.pagamento-card h3{
    margin-top:0;
    color:#ff007f;
}

.pagamento-linha{
    margin:8px 0;
}

.pagamento-status{
    display:inline-block;
    padding:6px 10px;
    border-radius:8px;
    font-weight:bold;
}

.pagamento-status.pago{
    background:#d8f5df;
    color:#147a32;
}

.pagamento-status.parcial{
    background:#fff0bd;
    color:#8a6500;
}

.pagamento-status.nao-pago{
    background:#ffd9d9;
    color:#a00000;
}

.pagamento-form{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid #eee;
}

.pagamento-form label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.pagamento-form input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.pagamento-registrar{
    width:100%;
    margin-top:12px;
    background:#ff007f;
}

.pagamento-registrar:hover{
    background:#e60073;
}

.pagamento-registrar:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =====================================================
   CONFIGURAÇÕES
   ===================================================== */

.config-card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 3px 10px #0002;
}

.config-card h3{
    margin-top:0;
    color:#ff007f;
}

.config-card label{
    display:block;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:6px;
}

.config-card input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}


/* =====================================================
   RESPONSIVO
   ===================================================== */

@media(max-width:600px){

    .admin-grid{
        grid-template-columns:1fr;
    }

    .admin-menu{
        grid-template-columns:1fr;
    }

}

</style></head><body><header class="admin-header"><div class="admin-logo">

    Vôlei<span>Terapia</span>

</div>

<div class="admin-subtitle">

    Painel de Administração

</div>

</header><main class="admin-container"><!-- =====================================================
     RESUMO
     ===================================================== --><section><div class="admin-grid"><div class="admin-card">

    <h3>Pedidos</h3>

    <div
        id="totalPedidos"
        class="admin-number"
    >
        0
    </div>

</div>


<div class="admin-card">

    <h3>Uniformes</h3>

    <div
        id="totalUniformes"
        class="admin-number"
    >
        0
    </div>

</div>


<div class="admin-card">

    <h3>Valor total</h3>

    <div
        id="valorTotal"
        class="admin-number"
    >
        R$ 0,00
    </div>

</div>


<div class="admin-card">

    <h3>Em aberto</h3>

    <div
        id="valorPendente"
        class="admin-number"
    >
        R$ 0,00
    </div>

</div>


<div class="admin-card">

    <h3>💵 Recebido</h3>

    <div
        id="valorRecebido"
        class="admin-number"
    >
        R$ 0,00
    </div>

</div>


<div class="admin-card">

    <h3>🟡 Pagamentos parciais</h3>

    <div
        id="pedidosParciais"
        class="admin-number"
    >
        0
    </div>

</div>


<div class="admin-card">

    <h3>❌ Não pagos</h3>

    <div
        id="pedidosNaoPagos"
        class="admin-number"
    >
        0
    </div>

</div>

</div></section><!-- =====================================================
     MENU
     ===================================================== --><section class="section"><h2 class="section-title">Administração

</h2><div class="admin-menu"><button
    class="admin-button"
    onclick="mostrarPedidos()"
>

    <span>📋</span>

    Pedidos

</button>


<button
    class="admin-button"
    onclick="mostrarUniformes()"
>

    <span>👕</span>

    Uniformes

</button>


<button
    class="admin-button"
    onclick="mostrarPagamentos()"
>

    <span>💰</span>

    Pagamentos

</button>


<button
    class="admin-button"
    onclick="mostrarProducao()"
>

    <span>🏭</span>

    Produção

</button>


<button
    class="admin-button"
    onclick="mostrarConfiguracoes()"
>

    <span>⚙️</span>

    Configurações

</button>

</div></section><!-- =====================================================
     ÁREA DE CONTEÚDO
     ===================================================== --><section class="section"><div
    id="conteudoAdmin"
    class="admin-list"
><div class="empty">

    Selecione uma opção acima.

</div>

</div></section><button
class="admin-button logout"
onclick="voltarInicio()"

</button></main><script src="admin.js"></script></body></html>
